<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 배경 그라디언트 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0d2040"/>
      <stop offset="100%" style="stop-color:#061830"/>
    </linearGradient>

    <!-- 뇌파 그라디언트 -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c9a7;stop-opacity:0.3"/>
      <stop offset="30%" style="stop-color:#00c9a7;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#0099cc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:0.3"/>
    </linearGradient>

    <!-- 뇌 실루엣 그라디언트 -->
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c9a7"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </linearGradient>

    <!-- 외곽 글로우 -->
    <radialGradient id="glowCenter" cx="50%" cy="52%" r="40%">
      <stop offset="0%" style="stop-color:#00c9a7;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#00c9a7;stop-opacity:0"/>
    </radialGradient>

    <!-- 상단 하이라이트 -->
    <radialGradient id="topHighlight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- 뇌파 글로우 필터 -->
    <filter id="waveGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 뇌 실루엣 글로우 -->
    <filter id="brainGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 점 글로우 -->
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 노이즈 텍스처 -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- 아이콘 모서리 마스크 (iOS 스타일) -->
    <clipPath id="iconShape">
      <rect width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconShape)">

    <!-- ① 배경 -->
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>

    <!-- ② 중앙 글로우 -->
    <rect width="1024" height="1024" fill="url(#glowCenter)"/>

    <!-- ③ 상단 하이라이트 -->
    <rect width="1024" height="1024" fill="url(#topHighlight)"/>

    <!-- ④ 미세 그리드 패턴 -->
    <g opacity="0.04">
      <line x1="0" y1="200" x2="1024" y2="200" stroke="white" stroke-width="1"/>
      <line x1="0" y1="400" x2="1024" y2="400" stroke="white" stroke-width="1"/>
      <line x1="0" y1="600" x2="1024" y2="600" stroke="white" stroke-width="1"/>
      <line x1="0" y1="800" x2="1024" y2="800" stroke="white" stroke-width="1"/>
      <line x1="200" y1="0" x2="200" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="400" y1="0" x2="400" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="600" y1="0" x2="600" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="800" y1="0" x2="800" y2="1024" stroke="white" stroke-width="1"/>
    </g>

    <!-- ⑤ 중앙 분할선 (뇌 좌우 반구 경계) -->
    <line x1="512" y1="180" x2="512" y2="820"
          stroke="rgba(255,255,255,0.06)" stroke-width="2"
          stroke-dasharray="12,16"/>

    <!-- ⑥ 뇌 실루엣 (채움 - 매우 은은하게) -->
    <path d="
      M512 185
      C460 180 400 195 370 230
      C340 260 330 290 335 320
      C310 330 285 350 280 385
      C270 425 290 460 315 478
      C300 500 295 525 305 550
      C318 580 345 595 370 595
      C375 625 385 655 400 670
      C425 695 460 700 490 690
      C500 715 506 730 512 735
      C518 730 524 715 534 690
      C564 700 599 695 624 670
      C639 655 649 625 654 595
      C679 595 706 580 719 550
      C729 525 724 500 709 478
      C734 460 754 425 744 385
      C739 350 714 330 689 320
      C694 290 684 260 654 230
      C624 195 564 180 512 185Z
    "
    fill="url(#brainGrad)" opacity="0.06" filter="url(#brainGlow)"/>

    <!-- ⑦ 뇌 실루엣 (외곽선 - 선명하게) -->
    <path d="
      M512 185
      C460 180 400 195 370 230
      C340 260 330 290 335 320
      C310 330 285 350 280 385
      C270 425 290 460 315 478
      C300 500 295 525 305 550
      C318 580 345 595 370 595
      C375 625 385 655 400 670
      C425 695 460 700 490 690
      C500 715 506 730 512 735
      C518 730 524 715 534 690
      C564 700 599 695 624 670
      C639 655 649 625 654 595
      C679 595 706 580 719 550
      C729 525 724 500 709 478
      C734 460 754 425 744 385
      C739 350 714 330 689 320
      C694 290 684 260 654 230
      C624 195 564 180 512 185Z
    "
    fill="none" stroke="url(#brainGrad)" stroke-width="5" opacity="0.5" filter="url(#brainGlow)"/>

    <!-- ⑧ 뇌 내부 주름 (은은한 곡선들) -->
    <g opacity="0.12" stroke="url(#brainGrad)" stroke-width="2" fill="none">
      <!-- 왼쪽 반구 주름 -->
      <path d="M390 300 C370 320 365 350 375 375"/>
      <path d="M360 400 C350 425 358 455 372 470"/>
      <path d="M385 490 C375 510 378 535 390 550"/>
      <path d="M420 560 C408 575 410 600 420 615"/>
      <!-- 오른쪽 반구 주름 -->
      <path d="M634 300 C654 320 659 350 649 375"/>
      <path d="M664 400 C674 425 666 455 652 470"/>
      <path d="M639 490 C649 510 646 535 634 550"/>
      <path d="M604 560 C616 575 614 600 604 615"/>
    </g>

    <!-- ⑨ 메인 뇌파 (EEG) — 가장 핵심 요소 -->
    <!-- 그림자/글로우 레이어 -->
    <polyline
      points="160,512  220,512  258,390  298,634  336,448  374,556  412,512  450,350  490,672  530,512  568,512  606,420  644,600  682,512  762,512  800,512"
      fill="none"
      stroke="#00c9a7"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.15"
      filter="url(#waveGlow)"
    />
    <!-- 메인 뇌파 라인 -->
    <polyline
      points="160,512  220,512  258,390  298,634  336,448  374,556  412,512  450,350  490,672  530,512  568,512  606,420  644,600  682,512  762,512  800,512"
      fill="none"
      stroke="url(#waveGrad)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#waveGlow)"
    />

    <!-- ⑩ 뇌파 피크 강조 점들 -->
    <!-- 최고점 (위) -->
    <circle cx="450" cy="350" r="18" fill="#00c9a7" opacity="0.9" filter="url(#dotGlow)"/>
    <circle cx="450" cy="350" r="8" fill="white" opacity="0.95"/>

    <!-- 최저점 (아래) -->
    <circle cx="490" cy="672" r="18" fill="#0099cc" opacity="0.9" filter="url(#dotGlow)"/>
    <circle cx="490" cy="672" r="8" fill="white" opacity="0.95"/>

    <!-- 중간 피크 -->
    <circle cx="258" cy="390" r="12" fill="#00c9a7" opacity="0.7" filter="url(#dotGlow)"/>
    <circle cx="298" cy="634" r="12" fill="#0099cc" opacity="0.7" filter="url(#dotGlow)"/>
    <circle cx="644" cy="600" r="12" fill="#0099cc" opacity="0.7" filter="url(#dotGlow)"/>

    <!-- ⑪ 왼쪽 기준선 점 -->
    <circle cx="160" cy="512" r="10" fill="#00c9a7" opacity="0.5"/>
    <!-- ⑫ 오른쪽 기준선 점 -->
    <circle cx="864" cy="512" r="10" fill="#0099cc" opacity="0.5"/>

    <!-- ⑬ BS·C 텍스트 (하단) -->
    <text x="512" y="870"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="68"
          font-weight="900"
          fill="white"
          text-anchor="middle"
          opacity="0.9"
          letter-spacing="4">BS·C</text>

    <!-- ⑭ 서브 텍스트 -->
    <text x="512" y="910"
          font-family="'Courier New', Courier, monospace"
          font-size="24"
          font-weight="400"
          fill="rgba(255,255,255,0.3)"
          text-anchor="middle"
          letter-spacing="8">BRAINSTAGE COGNITIVE</text>

    <!-- ⑮ 상단 장식 원 (뇌 위) -->
    <circle cx="512" cy="185" r="8" fill="#00c9a7" opacity="0.4" filter="url(#dotGlow)"/>
    <circle cx="512" cy="735" r="8" fill="#0099cc" opacity="0.4" filter="url(#dotGlow)"/>

    <!-- ⑯ 아이콘 테두리 하이라이트 -->
    <rect width="1024" height="1024" rx="224" ry="224"
          fill="none"
          stroke="rgba(255,255,255,0.06)"
          stroke-width="3"/>

  </g>
</svg>
