<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS-C 앱 아이콘 A</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #080810;
  color: #f0f0f8;
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  gap: 48px;
}

.title {
  text-align: center;
}

.title .eyebrow {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 4px;
  color: #00c9a7;
  margin-bottom: 8px;
}

.title h1 {
  font-size: 1.6rem;
  font-weight: 600;
  color: white;
}

/* 크기별 미리보기 */
.sizes-row {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
}

.size-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.size-icon {
  border-radius: calc(var(--size) * 0.22);
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  cursor: pointer;
}

.size-icon:hover { transform: scale(1.06) translateY(-4px); }

.size-icon img, .size-icon svg {
  display: block;
  width: var(--size);
  height: var(--size);
}

.size-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  color: rgba(255,255,255,0.3);
  letter-spacing: 1px;
}

/* 배경 별 미리보기 */
.bg-row {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}

.bg-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.bg-preview {
  width: 120px;
  height: 120px;
  border-radius: 26px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}

.bg-label {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.3);
  font-family: 'Space Mono', monospace;
}

/* 폰 목업 */
.phone {
  width: 200px;
  background: #0a0a14;
  border-radius: 36px;
  border: 2px solid rgba(255,255,255,0.08);
  padding: 20px 14px 28px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.7);
  position: relative;
}

.phone::before {
  content:'';
  display:block;
  width:60px; height:8px;
  background: rgba(255,255,255,0.07);
  border-radius:0 0 8px 8px;
  margin: 0 auto 16px;
}

.phone-time {
  font-size: 9px;
  color: rgba(255,255,255,0.3);
  text-align: right;
  margin-bottom: 8px;
  font-family: 'Space Mono', monospace;
}

.phone-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.phone-app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.phone-app-icon {
  width: 38px; height: 38px;
  border-radius: 9px;
  background: rgba(255,255,255,0.05);
}

.phone-app-name {
  font-size: 6px;
  color: rgba(255,255,255,0.35);
  text-align: center;
}

.phone-app.highlight .phone-app-name {
  color: #00c9a7;
  font-weight: 700;
}

.dl-btn {
  background: linear-gradient(135deg, #00c9a7, #0099cc);
  border: none;
  color: white;
  padding: 14px 32px;
  border-radius: 100px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
  box-shadow: 0 8px 24px rgba(0,201,167,0.3);
  display: inline-block;
}

.dl-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,201,167,0.4); }
</style>
</head>
<body>

<div class="title">
  <div class="eyebrow">APP ICON · CONCEPT A</div>
  <h1>BS·C 뇌파 + 뇌 실루엣</h1>
</div>

<!-- 크기별 -->
<div class="sizes-row">

  <div class="size-item">
    <div class="size-icon" style="--size:60px;">
      <img src="bsc-icon-A.svg" width="60" height="60">
    </div>
    <div class="size-label">60px<br>알림</div>
  </div>

  <div class="size-item">
    <div class="size-icon" style="--size:100px;">
      <img src="bsc-icon-A.svg" width="100" height="100">
    </div>
    <div class="size-label">100px<br>스팟라이트</div>
  </div>

  <div class="size-item">
    <div class="size-icon" style="--size:160px;">
      <img src="bsc-icon-A.svg" width="160" height="160">
    </div>
    <div class="size-label">160px<br>홈 화면</div>
  </div>

  <div class="size-item">
    <div class="size-icon" style="--size:240px;">
      <img src="bsc-icon-A.svg" width="240" height="240">
    </div>
    <div class="size-label">240px<br>앱 스토어</div>
  </div>

</div>

<!-- 배경별 -->
<div>
  <div style="text-align:center;font-family:'Space Mono',monospace;font-size:0.6rem;color:rgba(255,255,255,0.25);letter-spacing:3px;margin-bottom:16px;">배경 환경별 미리보기</div>
  <div class="bg-row">
    <div class="bg-item">
      <div class="bg-preview" style="background:#080810;">
        <img src="bsc-icon-A.svg" width="120" height="120">
      </div>
      <div class="bg-label">다크 배경</div>
    </div>
    <div class="bg-item">
      <div class="bg-preview" style="background:#f0f0f8;">
        <img src="bsc-icon-A.svg" width="120" height="120">
      </div>
      <div class="bg-label">라이트 배경</div>
    </div>
    <div class="bg-item">
      <div class="bg-preview" style="background:linear-gradient(135deg,#667eea,#764ba2);">
        <img src="bsc-icon-A.svg" width="120" height="120">
      </div>
      <div class="bg-label">컬러 배경</div>
    </div>
    <div class="bg-item">
      <div class="bg-preview" style="background:#1a1a2e;">
        <img src="bsc-icon-A.svg" width="120" height="120">
      </div>
      <div class="bg-label">네이비 배경</div>
    </div>
  </div>
</div>

<!-- 폰 목업 -->
<div>
  <div style="text-align:center;font-family:'Space Mono',monospace;font-size:0.6rem;color:rgba(255,255,255,0.25);letter-spacing:3px;margin-bottom:16px;">홈 화면 배치</div>
  <div class="phone">
    <div class="phone-time">9:41</div>
    <div class="phone-grid">
      <div class="phone-app"><div class="phone-app-icon" style="background:#1a2a3a;"></div><div class="phone-app-name">전화</div></div>
      <div class="phone-app"><div class="phone-app-icon" style="background:#1a3a1a;"></div><div class="phone-app-name">메모</div></div>
      <div class="phone-app"><div class="phone-app-icon" style="background:#3a1a1a;"></div><div class="phone-app-name">카메라</div></div>
      <div class="phone-app"><div class="phone-app-icon" style="background:#2a2a2a;"></div><div class="phone-app-name">설정</div></div>

      <div class="phone-app highlight" style="grid-column:2;">
        <div class="phone-app-icon" style="overflow:hidden;">
          <img src="bsc-icon-A.svg" width="38" height="38">
        </div>
        <div class="phone-app-name">BS·C</div>
      </div>
      <div class="phone-app"><div class="phone-app-icon" style="background:#1a1a3a;"></div><div class="phone-app-name">음악</div></div>
      <div class="phone-app"><div class="phone-app-icon" style="background:#2a1a3a;"></div><div class="phone-app-name">앱스토어</div></div>
    </div>
  </div>
</div>

<!-- 다운로드 -->
<a href="bsc-icon-A.svg" download="BS-C-icon.svg" class="dl-btn">⬇ SVG 다운로드</a>

</body>
</html>
